<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sober Canvas Background -->
  <rect width="800" height="450" fill="#0b0f14"/>

  <!-- Browser Container -->
  <g filter="url(#shadow2)" transform="translate(60, 42)">
    <rect width="680" height="366" rx="10" fill="#131a24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Top Bar -->
    <rect width="680" height="38" rx="10" fill="#0e141c"/>
    <circle cx="24" cy="19" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="19" r="4.5" fill="#10b981" opacity="0.8"/>
    <rect x="220" y="9" width="240" height="20" rx="4" fill="#161f2c"/>
    <text x="340" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">uiforge-library.netlify.app</text>

    <!-- Header -->
    <text x="30" y="70" font-family="sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">UIForge Component Architecture</text>
    <text x="30" y="88" font-family="sans-serif" font-size="11" fill="#94a3b8">Modular SCSS • Design Tokens • 12-Column Responsive Grid • npm v1.0.4</text>

    <!-- Row 1: Interactive Buttons & Form Inputs -->
    <g transform="translate(30, 105)">
      <rect width="300" height="108" rx="8" fill="#161f2c" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#14b8a6">BUTTON VARIANTS &amp; STATES</text>
      
      <!-- Primary -->
      <rect x="16" y="38" width="80" height="28" rx="5" fill="#14b8a6"/>
      <text x="56" y="56" font-family="sans-serif" font-size="11" font-weight="700" fill="#0b0f14" text-anchor="middle">Primary</text>
      
      <!-- Outline -->
      <rect x="106" y="38" width="80" height="28" rx="5" fill="none" stroke="#14b8a6" stroke-width="1.2"/>
      <text x="146" y="56" font-family="sans-serif" font-size="11" font-weight="600" fill="#14b8a6" text-anchor="middle">Outline</text>
      
      <!-- Ghost -->
      <rect x="196" y="38" width="80" height="28" rx="5" fill="#1e293b"/>
      <text x="236" y="56" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Ghost</text>

      <!-- Badge Tags -->
      <rect x="16" y="78" width="60" height="18" rx="4" fill="#134e4a"/>
      <text x="46" y="90" font-family="sans-serif" font-size="9" font-weight="600" fill="#2dd4bf" text-anchor="middle">Primary</text>
      <rect x="84" y="78" width="70" height="18" rx="4" fill="#1e293b"/>
      <text x="119" y="90" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Interactive</text>
      <rect x="160" y="78" width="75" height="18" rx="4" fill="#0e141c"/>
      <text x="197" y="90" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">SCSS Token</text>
    </g>

    <!-- Row 1: Right Side - Dropdowns and Inputs -->
    <g transform="translate(350, 105)">
      <rect width="300" height="108" rx="8" fill="#161f2c" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">INPUTS &amp; ACCESSIBLE DROPDOWNS</text>
      
      <!-- Input Mockup -->
      <rect x="16" y="38" width="160" height="28" rx="5" fill="#0e141c" stroke="#334155" stroke-width="1"/>
      <text x="26" y="56" font-family="sans-serif" font-size="11" fill="#64748b">Search tokens...</text>

      <!-- Dropdown -->
      <rect x="186" y="38" width="98" height="28" rx="5" fill="#0e141c" stroke="#14b8a6" stroke-width="1"/>
      <text x="198" y="56" font-family="sans-serif" font-size="11" fill="#f1f5f9">Select v1.0 ▼</text>

      <!-- Pagination pill -->
      <rect x="16" y="78" width="268" height="20" rx="4" fill="#0e141c"/>
      <text x="150" y="92" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">&lt; [ 1 ] [ 2 ] [ 3 ] ... [ 10 ] &gt;</text>
    </g>

    <!-- Row 2: Code & Token System -->
    <g transform="translate(30, 226)">
      <rect width="620" height="116" rx="8" fill="#0e141c" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="16" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#64748b">SCSS DESIGN TOKENS ARCHITECTURE</text>
      
      <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#2dd4bf">$forge-color-primary: #14b8a6;  $forge-radius-md: 6px;  $forge-spacing-unit: 4px;</text>
      <text x="16" y="64" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#93c5fd">$forge-breakpoints: (sm: 640px, md: 768px, lg: 1024px, xl: 1280px);</text>
      <text x="16" y="84" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fde047">.forge-btn--primary { background: var(--forge-primary); transition: all 0.2s ease; }</text>
      <text x="16" y="102" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">/* Zero external dependencies • 100% Tree-shakable &amp; Accessible */</text>
    </g>
  </g>
</svg>
